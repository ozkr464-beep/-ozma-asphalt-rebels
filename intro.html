<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>OZMA Gaming presenta — Asphalt Rebels</title>
  <link rel="stylesheet" href="css/intro.css">
</head>
<body>
  <main class="arcade" aria-label="Presentación experimental de Ozma Asphalt Rebels">
    <!-- Ambiente pixel art independiente de los títulos y la interfaz -->
    <div class="pixel-grid" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="speed-stripes speed-stripes--top" aria-hidden="true"></div>
    <div class="speed-stripes speed-stripes--bottom" aria-hidden="true"></div>

    <!-- PANTALLA 1: presentación del estudio. Se oculta con CSS tras 3 segundos. -->
    <section class="scene scene--studio" aria-label="OZMA Gaming presenta">
      <div class="studio-stack">
        <div class="logo-frame">
          <img
            class="studio-logo"
            src="assets/images/ozma-gaming.png"
            alt="Logo de OZMA Gaming con los ojos de Ozma"
            width="320"
            height="320"
          >
          <span class="logo-spark logo-spark--a" aria-hidden="true"></span>
          <span class="logo-spark logo-spark--b" aria-hidden="true"></span>
        </div>
        <p class="presents"><span>PRESENTS</span></p>
        <p class="arcade-foot">FROM THE STREETS TO THE GAME</p>
      </div>
    </section>

    <!-- PANTALLA 2: animación visual de carga. No simula porcentaje real. -->
    <section class="scene scene--loading" aria-label="Presentación del videojuego y carga visual">
      <div class="stars stars--a" aria-hidden="true"></div>
      <div class="stars stars--b" aria-hidden="true"></div>
      <div class="loading-stack">
        <div class="game-emblem" aria-hidden="true">✦</div>
        <p class="brand-mini">OZMA GAMING</p>
        <h1 class="game-logo">
          <span class="game-logo__top">OZMA</span>
          <span class="game-logo__main">ASPHALT</span>
          <span class="game-logo__bottom">REBELS</span>
        </h1>
        <p class="game-subtitle">BIKER DELIVERY ARCADE</p>
      </div>

      <div class="city" aria-hidden="true">
        <span class="building building--a"></span>
        <span class="building building--b"></span>
        <span class="building building--c"></span>
        <span class="building building--d"></span>
        <span class="building building--e"></span>
        <span class="building building--f"></span>
        <span class="building building--g"></span>
      </div>
      <div class="road" aria-hidden="true"><div class="road-markings"></div></div>

      <div class="loader" role="status" aria-label="Animación de preparación visual; carga real aún no implementada">
        <p class="loader-title">CARGANDO<span class="dots">...</span></p>
        <div class="loader-track" aria-hidden="true"><span class="loader-travel"></span></div>
        <p class="loader-note">PROTOTIPO VISUAL · SIN CARGA REAL</p>
        <a class="enter-link" href="index.html">ENTRAR AL MENÚ <span aria-hidden="true">▶</span></a>
      </div>
    </section>
  </main>
</body>
</html>
