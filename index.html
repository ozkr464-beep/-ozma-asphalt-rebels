
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12151b">

  <title>OZMA: Asphalt Rebels</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="game-container">

    <header class="game-header">
      <p class="studio">OZMA GAME STUDIO</p>
      <h1>ASPHALT <span>REBELS</span></h1>
      <p class="subtitle">BIKER DELIVERY ARCADE</p>
    </header>

    <main>

      <section class="city-preview">
        <div class="street">
          <span class="delivery-point">A → B</span>
          <span class="motorcycle">🏍️</span>
        </div>
        <p>DISTRITO CERO</p>
      </section>

      <nav class="main-menu" aria-label="Menú principal">
        <button type="button" disabled>
          JUGAR — PRÓXIMAMENTE
        </button>
      </nav>

      <section class="riders">
        <h2>SELECCIÓN DE RIDER</h2>

        <div class="rider-grid">
          <article class="rider-card">
            <h3>LINA</h3>
            <p>AGILIDAD</p>
          </article>

          <article class="rider-card">
            <h3>NYX</h3>
            <p>VELOCIDAD</p>
          </article>

          <article class="rider-card">
            <h3>TORO</h3>
            <p>RESISTENCIA</p>
          </article>
        </div>
      </section>

      <section class="districts">
        <h2>PROGRESO DE DISTRITOS</h2>
        <p>DISTRITO CERO — ZONA INICIAL</p>
        <p>Más distritos próximamente</p>
      </section>

    </main>

    <footer>
      <p>MVP 0.1 — DEMOSTRACIÓN VISUAL</p>
      <p>OZMA GAME STUDIO © 2026</p>
    </footer>

  </div>
</body>
</html>
