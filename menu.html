
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#12151b">

  <title>OZMA: Asphalt Rebels — Inicio</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/menu-arcade.css">
</head>

<body>
  <div class="game-container">

    <header class="game-header">
      <p class="studio">OZMA GAMING</p>

      <h1>
        ASPHALT <span>REBELS</span>
      </h1>

      <p class="subtitle">
        BIKER DELIVERY ARCADE
      </p>
    </header>

    <main>

      <!-- ESCENARIO RETRO PROVISIONAL -->

      <section class="city-preview"
               aria-label="Vista previa de Distrito Cero">

        <div class="street">

          <span class="delivery-point">
            A → B
          </span>

          <span class="motorcycle"
                aria-label="Motocicleta">🏍️</span>

        </div>

        <p>DISTRITO CERO</p>

      </section>

      <!-- COMIENZO DE LA SECUENCIA DE JUEGO -->

      <form class="main-menu"
            action="riders.html"
            method="get">

        <button type="submit">
          ▶ JUGAR
        </button>

      </form>

    </main>

    <footer class="game-footer">
      <p>OZMA GAMING © 2026</p>

      <p>
        MVP 0.1 — DEMOSTRACIÓN VISUAL
      </p>
    </footer>

  </div>
</body>
</html>
