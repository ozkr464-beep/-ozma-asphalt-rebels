
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#090d14">

  <title>Seleccionar Rider — Asphalt Rebels</title>

  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/rider-art.css">
</head>

<body>
  <main class="screen">

    <header class="screen-header">
      <a href="menu.html" class="back-button">
        ← VOLVER
      </a>

      <h1>ELIGE TU RIDER</h1>
      <p>ASPHALT REBELS</p>
    </header>

    <form class="rider-form"
          action="districts.html"
          method="get">

      <fieldset class="selection-list">
        <legend class="visually-hidden">
          Selecciona un personaje
        </legend>

        <!-- LINA -->
        <div class="rider-choice">
          <input
            class="rider-radio"
            type="radio"
            name="rider"
            id="rider-lina"
            value="lina"
            required
          >

          <label class="selection-card lina"
                 for="rider-lina">

            <img
              class="rider-art"
              src="assets/images/riders/lina-portrait.png"
              alt="Retrato pixel art de Lina"
              width="96"
              height="96"
            >

            <span class="rider-copy">
              <strong>LINA</strong>
              <small>AGILIDAD</small>
            </span>

            <span class="selection-indicator"
                  aria-hidden="true"></span>
          </label>
        </div>

        <!-- NYX -->
        <div class="rider-choice">
          <input
            class="rider-radio"
            type="radio"
            name="rider"
            id="rider-nyx"
            value="nyx"
            required
          >

          <label class="selection-card nyx"
                 for="rider-nyx">

            <img
              class="rider-art"
              src="assets/images/riders/nyx-portrait.png"
              alt="Retrato pixel art de Nyx"
              width="96"
              height="96"
            >

            <span class="rider-copy">
              <strong>NYX</strong>
              <small>VELOCIDAD</small>
            </span>

            <span class="selection-indicator"
                  aria-hidden="true"></span>
          </label>
        </div>

        <!-- TORO -->
        <div class="rider-choice">
          <input
            class="rider-radio"
            type="radio"
            name="rider"
            id="rider-toro"
            value="toro"
            required
          >

          <label class="selection-card toro"
                 for="rider-toro">

            <img
              class="rider-art"
              src="assets/images/riders/toro-portrait.png"
              alt="Retrato pixel art de Toro"
              width="96"
              height="96"
            >

            <span class="rider-copy">
              <strong>TORO</strong>
              <small>RESISTENCIA</small>
            </span>

            <span class="selection-indicator"
                  aria-hidden="true"></span>
          </label>
        </div>

      </fieldset>

      <footer class="screen-footer">

        <p>ELIGE UN RIDER PARA CONTINUAR</p>

        <button class="action-button"
                type="submit">
          CONTINUAR →
        </button>

      </footer>

    </form>

  </main>
</body>
</html>
