
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Seleccionar Distrito — Asphalt Rebels</title>

  <link rel="stylesheet" href="css/navigation.css">
</head>

<body>
  <main class="screen">

    <header class="screen-header">
      <a href="riders.html" class="back-button">
        ← VOLVER
      </a>

      <h1>ELIGE DISTRITO</h1>
      <p>ASPHALTA CITY</p>
    </header>

    <section class="selection-list"
             aria-label="Distritos del juego">

      <article class="district-option available">
        <div>
          <h2>DISTRITO CERO</h2>
          <p>TUTORIAL — ZONA INICIAL</p>
        </div>
        <span>01</span>
      </article>

      <article class="district-option locked">
        <div>
          <h2>DISTRITO MERCADO</h2>
          <p>PEATONES Y CAOS</p>
        </div>
        <span>🔒</span>
      </article>

      <article class="district-option locked">
        <div>
          <h2>DISTRITO LLUVIA</h2>
          <p>CLIMA ADVERSO</p>
        </div>
        <span>🔒</span>
      </article>

      <article class="district-option locked">
        <div>
          <h2>DISTRITO FEDERAL REBEL</h2>
          <p>RUTAS PELIGROSAS</p>
        </div>
        <span>🔒</span>
      </article>

      <article class="district-option locked">
        <div>
          <h2>DISTRITO ANOMALÍA</h2>
          <p>EVENTOS EXTRAÑOS</p>
        </div>
        <span>🔒</span>
      </article>

    </section>

    <footer class="screen-footer">
      <p>MAPAS EN DESARROLLO</p>

      <button class="action-button" type="button" disabled>
        INICIAR PARTIDA — PRÓXIMAMENTE
      </button>
    </footer>

  </main>
</body>
</html>
