<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1119">
  <title>Distrito Cero — Mapa estático V0.1</title>
  <link rel="stylesheet" href="css/map-demo.css">
</head>
<body>
  <main class="demo-screen">
    <header class="demo-header">
      <a href="districts.html" class="back-link">← VOLVER A DISTRITOS</a>
      <p class="eyebrow">OZMA GAMING / MAP LAB 01</p>
      <h1>DISTRITO CERO</h1>
      <p class="subtitle">MAPA EXPERIMENTAL · VISTA CENITAL</p>
    </header>

    <section class="stage" aria-label="Vista de prueba del mapa Distrito Cero">
      <img
        class="map-image"
        src="assets/maps/distrito-cero-map-v01.png"
        alt="Mapa pixel art cenital con taller Ozma, taquería, calles, viviendas y parque"
        width="320" height="384"
      >
      <span class="point point-a" aria-label="Punto A: recoger comida">A</span>
      <span class="point point-b" aria-label="Punto B: entregar comida">B</span>
      <img
        class="bike"
        src="assets/sprites/moto-prototipo-v01.png"
        alt="Motocicleta estática de prueba"
        width="16" height="24"
      >
    </section>

    <section class="map-legend" aria-label="Leyenda del mapa">
      <p><strong>A</strong> RECOGER PEDIDO</p>
      <p><strong>B</strong> ENTREGAR PEDIDO</p>
      <p class="note">ESCENARIO ESTÁTICO · SIN MOVIMIENTO NI COLISIONES</p>
    </section>
  </main>
</body>
</html>
